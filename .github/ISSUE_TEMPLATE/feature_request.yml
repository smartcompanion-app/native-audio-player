name: Feature request
description: Suggest a capability the plugin does not have yet.
labels: ['enhancement']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that the plugin does not let you do today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        If you have an API in mind, sketch it here. Note that anything added has
        to work on Android and iOS, and degrade sensibly on the web.
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms this should cover
      multiple: true
      options:
        - Android
        - iOS
        - Web
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Workarounds you have tried, or other plugins that solve this.
