name: ci

# Pushes are only built for main. A push to any other branch that has a PR open
# would otherwise be built twice -- once for the push, once for the pull_request.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A new push to a PR makes the run in progress obsolete. Runs on main are never
# cancelled, they gate the release.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: 22
  JAVA_VERSION: 21
  ANDROID_API_LEVEL: 36
  # Kept in sync between the snapshot and the test run -- the emulator only
  # reuses a cached snapshot when it was created with the same options.
  EMULATOR_OPTIONS: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none

jobs:

  # Compilation and the native unit tests for all three platforms. The e2e jobs
  # below deliberately do not repeat this -- they only build what they need to
  # get an installable app onto a device.
  verify_lint:
    name: Build and Verify
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - name: Install dependencies
        run: npm ci
      - name: Build iOS
        run: npm run verify:ios
      - name: Build Android
        run: npm run verify:android
      - name: Build Web
        run: npm run verify:web

  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Run Lint script
        run: npm run lint

  test_ios:
    name: Build and Test (iOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build plugin
        run: npm run build
      - name: Install example dependencies
        run: npm ci
        working-directory: ./example
      - name: Build example
        run: npm run build
        working-directory: ./example
      - name : Sync Capacitor iOS
        run: npx cap sync ios
        working-directory: ./example
      - name: Build example iOS
        run: npm run build:ios
        working-directory: ./example
      - name: Boot iOS Simulator
        run: |
          # List available simulators to verify iOS 18.6 is installed
          xcrun simctl list devices available

          # Find iPhone 16 with iOS 18.6
          UDID=$(xcrun simctl list devices available | grep "iOS 18.6" -A 20 | grep "iPhone 16 (" | head -1 | grep -oE "[0-9A-F]{8}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{4}-[0-9A-F]{12}")

          if [ -z "$UDID" ]; then
            echo "Error: iPhone 16 with iOS 18.6 not found"
            echo "Available devices:"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Booting iPhone 16 (iOS 18.6) with UDID: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
      # appium-xcuitest-driver resolves the SDK version during session creation
      # with a hardcoded 15s timeout. The first xcrun call on a cold runner can
      # exceed that, which fails the session before any test runs. Warm it here,
      # where being slow costs time instead of the whole job.
      - name: Warm up Xcode toolchain
        run: xcrun --sdk iphonesimulator --show-sdk-version
      - name: Run Tests on iOS Simulator
        run: npm run test:ios
        working-directory: ./example
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-ios
          path: example/logs/
          if-no-files-found: ignore
          retention-days: 7

  test_android:
    name: Build and Test (Android)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            example/package-lock.json
      - name: Set up Java ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
      - name: Install dependencies
        run: npm ci
      - name: Build plugin
        run: npm run build
      - name: Install example dependencies
        run: npm ci
        working-directory: ./example
      - name: Build example
        run: npm run build
        working-directory: ./example
      - name : Sync Capacitor Android
        run: npx cap sync android
        working-directory: ./example
      - name: Build example Android
        run: npm run build:android
        working-directory: ./example
      # Appium downloads a chromedriver matching the emulator's webview the
      # first time a test attaches to it, and stores it inside the driver
      # package rather than in a home directory. Restoring it here -- after
      # npm ci, which would wipe it -- keeps that off the network.
      - name: Cache chromedriver
        uses: actions/cache@v4
        with:
          path: example/node_modules/appium-uiautomator2-driver/node_modules/appium-chromedriver/chromedriver
          key: chromedriver-${{ runner.os }}-${{ hashFiles('example/package-lock.json') }}
          restore-keys: |
            chromedriver-${{ runner.os }}-
      # The emulator only reuses a snapshot that was created with the same
      # options, so the key has to change when the workflow does.
      - name: Cache AVD snapshot
        uses: actions/cache@v4
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.ANDROID_API_LEVEL }}-google_apis-x86_64-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Create AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: ${{ env.EMULATOR_OPTIONS }}
          disable-animations: false
          script: echo "Generated AVD snapshot for caching."
      - name: Run Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.ANDROID_API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save ${{ env.EMULATOR_OPTIONS }}
          disable-animations: true
          script: npm run test:android
          working-directory: ./example
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs-android
          path: example/logs/
          if-no-files-found: ignore
          retention-days: 7
