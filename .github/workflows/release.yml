name: release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required for npm trusted publishing: npm exchanges this workflow's OIDC
  # token for a short-lived publish token, so no npm token is stored anywhere.
  # The same OIDC identity is what signs the provenance attestation.
  id-token: write

env:
  NODE_VERSION: 22

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # No registry-url on purpose: it writes an .npmrc pinning the auth token
      # to NODE_AUTH_TOKEN, and trusted publishing authenticates over OIDC
      # instead. Leaving it would point npm at an unset variable.
      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Trusted publishing landed in npm 11.5.1 and Node 22 still bundles
      # npm 10, so upgrade npm rather than the Node version — the release job
      # then builds on the same runtime CI tests against.
      - name: Update npm
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      # Opens (or updates) a "chore: release" pull request collecting the
      # pending changesets. Merging that PR runs this workflow again, at which
      # point there are no changesets left and `publish` runs instead.
      #
      # RELEASE_TOKEN is a personal access token with contents and pull request
      # write access. It is optional but recommended: pull requests opened with
      # the default GITHUB_TOKEN do not trigger workflows, so the release pull
      # request would sit with no CI checks and main's required checks could
      # never pass on it. Falls back to GITHUB_TOKEN when the secret is absent.
      - name: Create release pull request or publish
        uses: changesets/action@v1
        with:
          github-token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          version: npm run version
          publish: npm run release
          title: 'chore: release'
          commit: 'chore: release'
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
          # npm authenticates over OIDC against the trusted publisher
          # configured for this package (this repository, this workflow file),
          # so there is deliberately no npm token here. Provenance is implied by
          # trusted publishing; the flag is kept so the intent stays explicit.
          NPM_CONFIG_PROVENANCE: true
